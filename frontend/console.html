<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prahari — Officer Console</title>
  <meta name="description" content="Prahari officer console — the live, API-backed triage feed: geo-clustered incidents, deterministic confidence tiers, and a hash-chained evidence ledger." />
  <meta name="theme-color" content="#071614" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23071614'/%3E%3Cpath d='M16 4l9 3.5v7.2c0 5.9-3.8 9.9-9 12.8-5.2-2.9-9-6.9-9-12.8V7.5z' fill='none' stroke='%23E08E45' stroke-width='2.2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">प्रहरी</span>
      <div>
        <h1>Prahari</h1>
        <p>Bystander-corroborated flood verification &mdash; Mumbai / Maharashtra monsoon</p>
      </div>
    </div>
    <div class="actions">
      <a href="/" class="home-link">← back to Prahari</a>
      <button id="seedBtn" class="btn">Seed demo reports</button>
      <button id="refreshBtn" class="btn primary">Refresh feed</button>
    </div>
  </header>

  <main>
    <section class="left">
      <div class="panel">
        <div class="panel-head">
          <h2>Active incidents</h2>
          <div class="legend">
            <span class="chip high">High-Confidence</span>
            <span class="chip corr">Corroborated</span>
            <span class="chip unv">Unverified</span>
          </div>
        </div>
        <div id="incidentList" class="incident-list"></div>
      </div>
    </section>

    <section class="center">
      <div id="map"></div>
    </section>

    <section class="right">
      <div class="panel" id="detailPanel">
        <div class="panel-head"><h2>Incident detail</h2></div>
        <div id="detail" class="detail">
          <p class="muted">Select an incident to inspect its reports, ambient corroboration, and evidence trail.</p>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Evidence ledger</h2>
          <div class="ledger-actions">
            <button id="verifyLedgerBtn" class="btn small">Verify chain</button>
            <button id="tamperBtn" class="btn small danger">Simulate tamper</button>
          </div>
        </div>
        <div id="ledgerStatus" class="ledger-status"></div>
        <div id="ledgerList" class="ledger-list"></div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
